name: release

# Build binaries and publish a GitHub Release whenever a version tag is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: tar -czf scrolls-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release scrolls

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: scrolls-${{ matrix.target }}.tar.gz
