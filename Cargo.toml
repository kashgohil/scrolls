[package]
name = "scrolls"
version = "0.1.2"
edition = "2024"
description = "A terminal RSS reader"
license = "MIT"
repository = "https://github.com/kashgohil/scrolls"
readme = "README.md"
keywords = ["rss", "tui", "terminal", "feed-reader"]
categories = ["command-line-utilities"]

# Smaller, faster release binaries for distribution.
[profile.release]
strip = true
lto = true

[dependencies]
dirs = "6.0.0"
feed-rs = "2.3.1"
html2text = "0.17.1"
opml = "1.1.6"
open = "5.3.5"
ratatui = "0.30.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
ureq = "3.3.0"
dom_smoothie = "0.17.0"
